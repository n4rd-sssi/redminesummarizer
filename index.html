<!DOCTYPE html>
<html>
<head>

<title>Redmine Task Summarizer V2</title>

<link rel="icon" type="image/png" href="favicon.png">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Montserrat',sans-serif;
    background:#f4f6fb;
    margin:0;
    padding:40px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-family:'Montserrat',sans-serif;
}

.card{
    background:white;
    border-radius:10px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:240px;
    padding:12px;
    border-radius:6px;
    border:1px solid #ccc;
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    resize:vertical;
    box-sizing:border-box;
}

.buttons{
    margin-top:15px;
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
    font-family:'Montserrat',sans-serif;
}

button:hover{
    opacity:0.9;
}

.generate{
    background:#4CAF50;
    color:white;
}

.clear{
    background:#888;
    color:white;
}

.copy{
    background:#1976d2;
    color:white;
    margin-bottom:10px;
}

.small{
    background:#ddd;
}

.status-grid,
.type-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}

.status-grid label,
.type-grid label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
}

.assignee{
    margin-top:20px;
}

.assignee h3{
    border-bottom:2px solid #eee;
    padding-bottom:5px;
}

li{
    margin-bottom:6px;
}

a{
    color:black;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
    color:black;
}

.info{
    font-size:13px;
    color:#666;
    margin-top:10px;
    line-height:1.5;
}

.summary{
    font-size:13px;
    color:#666;
    margin-bottom:15px;
}

.empty-output{
    color:#888;
    font-style:italic;
}

@media(max-width:800px){

    body{
        padding:20px;
    }

    .status-grid,
    .type-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .status-grid,
    .type-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>Redmine Task Summarizer</h1>

<!-- STATUS FILTER -->

<div class="card">

<h3>Status Filter</h3>

<div>
    <button class="small" onclick="selectAll()">Select All</button>
    <button class="small" onclick="clearAll()">Clear All</button>
</div>

<div class="status-grid">

<label>
    <input type="checkbox" value="New" checked>
    New
</label>

<label>
    <input type="checkbox" value="Briefing Request">
    Briefing Request
</label>

<label>
    <input type="checkbox" value="In Progress" checked>
    In Progress
</label>

<label>
    <input type="checkbox" value="Pre-QA Request">
    Pre-QA Request
</label>

<label>
    <input type="checkbox" value="QA Request" checked>
    QA Request
</label>

<label>
    <input type="checkbox" value="QA Process">
    QA Process
</label>

<label>
    <input type="checkbox" value="Feedback" checked>
    Feedback
</label>

<label>
    <input type="checkbox" value="Final QA">
    Final QA
</label>

<label>
    <input type="checkbox" value="PM Review">
    PM Review
</label>

<label>
    <input type="checkbox" value="Specs Review">
    Specs Review
</label>

<label>
    <input type="checkbox" value="Change of QA Start Date">
    Change of QA Start Date
</label>

<label>
    <input type="checkbox" value="Change of Deployment Date">
    Change of Deployment Date
</label>

<label>
    <input type="checkbox" value="Change Project Name">
    Change Project Name
</label>

<label>
    <input type="checkbox" value="Ready for Inspection">
    Ready for Inspection
</label>

<label>
    <input type="checkbox" value="Deploy Request">
    Deploy Request
</label>

<label>
    <input type="checkbox" value="Development Request">
    Development Request
</label>

<label>
    <input type="checkbox" value="On Hold">
    On Hold
</label>

<label>
    <input type="checkbox" value="Closed">
    Closed
</label>

<label>
    <input type="checkbox" value="Rejected">
    Rejected
</label>

</div>

</div>


<!-- TICKET TYPE FILTER -->

<div class="card">

<h3>Ticket Type Filter</h3>

<div>
    <button class="small" onclick="selectAllTypes()">Select All</button>
    <button class="small" onclick="clearAllTypes()">Clear All</button>
</div>

<div class="type-grid" id="ticketTypeGrid">
    <div class="info">
        Paste Redmine tasks below to detect ticket types.
    </div>
</div>

</div>


<!-- INPUT -->

<div class="card">

<textarea
    id="inputText"
    oninput="updateTicketTypeFilter()"
    placeholder="Paste Redmine tasks here...

Supported formats:

1. Standard task/subtask format
    OR
2. Redmine issue-list format
"
></textarea>

<div class="buttons">

    <button class="generate" onclick="generate()">
        Generate
    </button>

    <button class="clear" onclick="clearText()">
        Clear
    </button>

    <label style="display:flex;align-items:center;gap:6px;margin-left:10px;">
        <input type="checkbox" id="includeStatus" checked>
        Include Status
    </label>

</div>

<div class="info">

</div>

</div>


<!-- OUTPUT -->

<div class="card">

<button class="copy" onclick="copyOutput()">
    Copy Output
</button>

<div id="output"></div>

</div>

</div>


<script>

/*
=========================================================
GET SELECTED STATUSES
=========================================================
*/

function getSelectedStatuses(){

    let checkboxes =
        document.querySelectorAll(".status-grid input:checked");

    let statuses = [];

    checkboxes.forEach(cb=>{
        statuses.push(cb.value);
    });

    return statuses;

}


/*
=========================================================
GET SELECTED TICKET TYPES
=========================================================
*/

function getSelectedTicketTypes(){

    let checkboxes =
        document.querySelectorAll(".type-grid input:checked");

    let ticketTypes = [];

    checkboxes.forEach(cb=>{
        ticketTypes.push(cb.value);
    });

    return ticketTypes;

}


/*
=========================================================
UPDATE TICKET TYPE FILTER

Ticket types are detected automatically from the
currently pasted tasks.

Examples:

Feedback #122431  -> Feedback
Feature #122430   -> Feature
Deployment #52526 -> Deployment
=========================================================
*/

function updateTicketTypeFilter(){

    let grid =
        document.getElementById("ticketTypeGrid");

    let text =
        document.getElementById("inputText").value;

    /*
    Preserve the user's current checkbox selections
    when the pasted text changes.
    */

    let previousState = new Map();

    grid
    .querySelectorAll("input[type='checkbox']")
    .forEach(cb=>{
        previousState.set(cb.value, cb.checked);
    });


    let ticketTypes = new Set();

    text
    .split("\n")
    .forEach(rawLine=>{

        let task =
            parseTaskLine(rawLine);

        if(
            task &&
            task.ticketType &&
            task.ticketType !== "Unknown"
        ){
            ticketTypes.add(task.ticketType);
        }

    });


    let sortedTypes =
        Array.from(ticketTypes)
        .sort((a,b)=>a.localeCompare(b));


    if(sortedTypes.length === 0){

        grid.innerHTML = `
            <div class="info">
                Paste Redmine tasks below to detect ticket types.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        sortedTypes.map(type=>{

            /*
            New ticket types default to selected.
            Existing types keep their previous state.
            */

            let checked =
                previousState.has(type)
                    ? previousState.get(type)
                    : true;

            return `
                <label>
                    <input
                        type="checkbox"
                        value="${escapeHtml(type)}"
                        ${checked ? "checked" : ""}
                    >
                    ${escapeHtml(type)}
                </label>
            `;

        }).join("");

}


/*
=========================================================
PARSE TASK LINE

Supports two input formats:

---------------------------------------------------------

FORMAT 1

Feature #113752: Add PTO Tab...
Final QA
Punzalan, Maurice Joyce
07/01/2026
08/31/2026

Tab-separated:

0 = Issue
1 = Status
2 = Assignee
3 = Start Date
4 = Due Date

---------------------------------------------------------

FORMAT 2

122441
Parañaque OBO Web...
Feedback
Feature #122430
Add confirmation prompt...
New
Normal
Aban, Marvin
...

Tab-separated:

0 = #
1 = Project
2 = Tracker
3 = Parent Task
4 = Subject
5 = Status
6 = Priority
7 = Assignee
8 = % Done
9 = % QA Done
10 = Updated
11 = Updated QA Start Date
12 = Updated Deployment Date
13 = Due Date

NOTE:

When copying from Redmine, columns 8 onward may
sometimes appear on the next physical line.

That is OK because the summarizer currently only
needs columns 0 through 7.
=========================================================
*/

function parseTaskLine(rawLine){

    // Remove carriage return but preserve tabs.
    rawLine = rawLine.replace(/\r/g,"");

    if(!rawLine.trim()){
        return null;
    }


    /*
    Ignore action/helper rows generated by Redmine.
    */

    if(
        rawLine.includes("Delete link") ||
        rawLine.trim() === "Actions"
    ){
        return null;
    }


    let parts = rawLine.split("\t");


    /*
    Some Redmine list rows begin with an empty tab:

        [blank] 122436 Project ...

    Remove ONLY leading empty columns.
    */

    while(
        parts.length > 0 &&
        parts[0].trim() === ""
    ){
        parts.shift();
    }


    if(parts.length === 0){
        return null;
    }


    /*
    =====================================================
    FORMAT 2
    REDMINE ISSUE LIST
    =====================================================
    */

    let firstColumn = parts[0].trim();


    if(
        /^\d+$/.test(firstColumn) &&
        parts.length >= 8
    ){

        let ticketNumber =
            firstColumn;

        let project =
            parts[1]?.trim() || "";

        let tracker =
            parts[2]?.trim() || "";

        let parentTask =
            parts[3]?.trim() || "";

        let subject =
            parts[4]?.trim() || "";

        let status =
            parts[5]?.trim() || "";

        let priority =
            parts[6]?.trim() || "";

        let assignee =
            parts[7]?.trim() || "Unassigned";


        /*
        Prevent incomplete/random numeric rows from
        being interpreted as tickets.
        */

        if(!subject || !status){
            return null;
        }


        /*
        Construct standard Redmine-style display:

        Feedback #122441: Subject
        Feature #122430: Subject
        Deployment #122397: Subject
        */

        let issue;

        if(tracker){

            issue =
                `${tracker} #${ticketNumber}: ${subject}`;

        }else{

            issue =
                `#${ticketNumber}: ${subject}`;

        }


        return{

            format:"issue-list",

            ticketNumber:ticketNumber,

            issue:issue,

            status:status,

            assignee:assignee,

            project:project,

            tracker:tracker,

            ticketType:tracker || "Unknown",

            parentTask:parentTask,

            priority:priority

        };

    }



    /*
    =====================================================
    FORMAT 1
    ORIGINAL TASK / SUBTASK COPY FORMAT
    =====================================================
    */

    if(parts.length >= 5){

        let issue =
            parts[0].trim();

        /*
        A valid old-format task should contain:

        Feature #12345
        Feedback #12345
        Deployment #12345
        etc.
        */

        let ticketNumberMatch =
            issue.match(/#(\d+)/);


        if(!ticketNumberMatch){
            return null;
        }


        let ticketNumber =
            ticketNumberMatch[1];

        /*
        Extract the ticket type from the text before
        the ticket number.

        Example:
        Feedback #122431: Subject
        -> Feedback
        */

        let ticketTypeMatch =
            issue.match(/^(.+?)\s+#\d+/);

        let ticketType =
            ticketTypeMatch
                ? ticketTypeMatch[1].trim()
                : "Unknown";

        let status =
            parts[1]?.trim() || "";

        let assignee =
            parts[2]?.trim() || "Unassigned";

        let start =
            parts[3]?.trim() || "";

        let due =
            parts[4]?.trim() || "";


        if(!status){
            return null;
        }


        return{

            format:"standard",

            ticketNumber:ticketNumber,

            issue:issue,

            ticketType:ticketType,

            status:status,

            assignee:assignee,

            start:start,

            due:due

        };

    }


    /*
    Anything else is ignored.

    This includes continuation rows such as:

    08/18/2026 09:34 AM
    08/18/2026
    08/18/2026
    08/18/2026
    Actions
    */

    return null;

}


/*
=========================================================
GENERATE SUMMARY
=========================================================
*/

function generate(){

    /*
    Refresh detected ticket types before filtering.
    */

    updateTicketTypeFilter();

    let validStatus =
        getSelectedStatuses();

    let validTicketTypes =
        getSelectedTicketTypes();

    let hasTicketTypeOptions =
        document.querySelectorAll(".type-grid input").length > 0;

    let text =
        document.getElementById("inputText").value;

    let includeStatus =
        document.getElementById("includeStatus").checked;

    let lines =
        text.split("\n");

    let grouped = {};

    let totalParsed = 0;

    let totalIncluded = 0;


    lines.forEach(rawLine=>{

        let task =
            parseTaskLine(rawLine);


        if(!task){
            return;
        }


        totalParsed++;


        /*
        Apply Status Filter
        */

        if(!validStatus.includes(task.status)){
            return;
        }


        /*
        Apply Ticket Type Filter
        */

        if(
            hasTicketTypeOptions &&
            !validTicketTypes.includes(task.ticketType)
        ){
            return;
        }


        totalIncluded++;


        /*
        Group by assignee
        */

        if(!grouped[task.assignee]){

            grouped[task.assignee] = [];

        }


        grouped[task.assignee].push(task);

    });


    render(
        grouped,
        includeStatus,
        totalParsed,
        totalIncluded
    );

}


/*
=========================================================
RENDER OUTPUT
=========================================================
*/

function render(
    grouped,
    includeStatus,
    totalParsed,
    totalIncluded
){

    let html = "";


    /*
    Sort assignees alphabetically.
    */

    let sortedAssignees =
        Object.keys(grouped).sort(
            (a,b)=>a.localeCompare(b)
        );


    /*
    Nothing passed current status filters.
    */

    if(sortedAssignees.length === 0){

        document.getElementById("output").innerHTML =
            `<div class="empty-output">
                No tasks matched the selected status and ticket type filters.
            </div>`;

        return;

    }


    /*
    Small processing summary.
    */

    html += `
        <div class="summary">
            ${totalIncluded} of ${totalParsed}
            detected task${totalParsed === 1 ? "" : "s"}
            included.
        </div>
    `;


    sortedAssignees.forEach(assignee=>{

        html += `
            <div class="assignee">
                <h3>${escapeHtml(assignee)}</h3>
                <ul>
        `;


        /*
        Sort tickets numerically by ticket ID.
        */

        grouped[assignee]
        .sort((a,b)=>{

            let numA =
                parseInt(a.ticketNumber || 0);

            let numB =
                parseInt(b.ticketNumber || 0);

            return numA - numB;

        })
        .forEach(task=>{


            let issueText =
                escapeHtml(task.issue);


            let issueLink =
                task.ticketNumber

                ? `<a
                    href="https://redmine.sandmansystems.com/issues/${encodeURIComponent(task.ticketNumber)}"
                    target="_blank"
                    rel="noopener noreferrer"
                   >${issueText}</a>`

                : issueText;


            if(includeStatus){

                html += `
                    <li>
                        ${escapeHtml(task.status)}
                        |
                        ${issueLink}
                    </li>
                `;

            }

            else{

                html += `
                    <li>
                        ${issueLink}
                    </li>
                `;

            }

        });


        html += `
                </ul>
            </div>
        `;

    });


    document.getElementById("output").innerHTML =
        html;

}


/*
=========================================================
HTML ESCAPE

Prevents pasted task names from being interpreted
as HTML.
=========================================================
*/

function escapeHtml(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/*
=========================================================
COPY OUTPUT
=========================================================
*/

function copyOutput(){

    let output =
        document.getElementById("output");

    let text =
        output.innerText.trim();


    if(!text){

        alert("There is no output to copy.");

        return;

    }


    navigator.clipboard
    .writeText(text)
    .then(()=>{

        alert("Copied to clipboard");

    })
    .catch(()=>{

        alert("Unable to copy to clipboard.");

    });

}


/*
=========================================================
CLEAR
=========================================================
*/

function clearText(){

    document.getElementById("inputText").value = "";

    document.getElementById("output").innerHTML = "";

    updateTicketTypeFilter();

}


/*
=========================================================
SELECT ALL STATUSES
=========================================================
*/

function selectAll(){

    document
    .querySelectorAll(".status-grid input")
    .forEach(cb=>{

        cb.checked = true;

    });

}


/*
=========================================================
CLEAR ALL STATUSES
=========================================================
*/

function clearAll(){

    document
    .querySelectorAll(".status-grid input")
    .forEach(cb=>{

        cb.checked = false;

    });

}


/*
=========================================================
SELECT ALL TICKET TYPES
=========================================================
*/

function selectAllTypes(){

    document
    .querySelectorAll(".type-grid input")
    .forEach(cb=>{

        cb.checked = true;

    });

}


/*
=========================================================
CLEAR ALL TICKET TYPES
=========================================================
*/

function clearAllTypes(){

    document
    .querySelectorAll(".type-grid input")
    .forEach(cb=>{

        cb.checked = false;

    });

}

</script>

</body>
</html>

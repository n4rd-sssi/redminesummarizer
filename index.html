<!DOCTYPE html>
<html>
<head>
<title>Redmine Task Generator</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:'Montserrat',sans-serif;
background:#f4f6fb;
margin:0;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:25px;
}

.card{
background:white;
border-radius:10px;
padding:25px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
margin-bottom:20px;
}

textarea{
width:100%;
height:240px;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
font-family:'Montserrat', sans-serif;
font-size:14px;
resize:vertical;
}

.buttons{
margin-top:15px;
display:flex;
gap:10px;
}

button{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:600;
font-family:'Montserrat', sans-serif;
}

.generate{background:#4CAF50;color:white;}
.clear{background:#888;color:white;}
.copy{background:#1976d2;color:white;margin-bottom:10px;}
.small{background:#ddd;}

.status-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:10px;
}

.status-grid label{
display:flex;
align-items:center;
gap:6px;
font-size:14px;
}

.assignee{
margin-top:20px;
}

.assignee h3{
border-bottom:2px solid #eee;
padding-bottom:5px;
}

li{
margin-bottom:6px;
}

</style>
</head>

<body>

<div class="container">

<h1>Redmine Task Summarizer</h1>

<div class="card">

<h3>Status Filter</h3>

<div>
<button class="small" onclick="selectAll()">Select All</button>
<button class="small" onclick="clearAll()">Clear All</button>
</div>

<div class="status-grid">

<label><input type="checkbox" value="New" checked>New</label>
<label><input type="checkbox" value="Briefing Request">Briefing Request</label>
<label><input type="checkbox" value="In Progress" checked>In Progress</label>
<label><input type="checkbox" value="Pre-QA Request">Pre-QA Request</label>
<label><input type="checkbox" value="QA Request" checked>QA Request</label>
<label><input type="checkbox" value="QA Process">QA Process</label>
<label><input type="checkbox" value="Feedback" checked>Feedback</label>
<label><input type="checkbox" value="Final QA">Final QA</label>
<label><input type="checkbox" value="PM Review">PM Review</label>
<label><input type="checkbox" value="Specs Review">Specs Review</label>
<label><input type="checkbox" value="Change of QA Start Date">Change of QA Start Date</label>
<label><input type="checkbox" value="Change of Deployment Date">Change of Deployment Date</label>
<label><input type="checkbox" value="Change Project Name">Change Project Name</label>
<label><input type="checkbox" value="Ready for Inspection">Ready for Inspection</label>
<label><input type="checkbox" value="Deploy Request">Deploy Request</label>
<label><input type="checkbox" value="Development Request">Development Request</label>
<label><input type="checkbox" value="On Hold">On Hold</label>
<label><input type="checkbox" value="Closed">Closed</label>
<label><input type="checkbox" value="Rejected">Rejected</label>

</div>

</div>

<div class="card">

<textarea id="inputText" placeholder="Paste Redmine tasks here..."></textarea>

<div class="buttons">
<button class="generate" onclick="generate()">Generate</button>
<button class="clear" onclick="clearText()">Clear</button>
</div>

</div>

<div class="card">

<button class="copy" onclick="copyOutput()">Copy Output</button>

<div id="output"></div>

</div>

</div>

<script>

function getSelectedStatuses(){

let checkboxes = document.querySelectorAll(".status-grid input:checked");

let statuses = [];

checkboxes.forEach(cb=>{
statuses.push(cb.value);
});

return statuses;

}

function generate(){

let validStatus = getSelectedStatuses();

let text = document.getElementById("inputText").value;

let lines = text.split("\n");

let grouped = {};

lines.forEach(line=>{

line=line.trim();

if(!line || line.includes("Delete link")) return;

let parts=line.split("\t");

if(parts.length < 5) return;

let issue=parts[0].trim();
let status=parts[1].trim();
let assignee=parts[2].trim();
let start=parts[3].trim();
let due=parts[4].trim();

if(!assignee) return;

if(!validStatus.includes(status)) return;

if(!grouped[assignee]) grouped[assignee]=[];

grouped[assignee].push(`${status} | ${issue}`);

});

render(grouped);

}

function render(grouped){

let html="";

for(let assignee in grouped){

html+=`<div class="assignee"><h3>${assignee}</h3><ul>`;

grouped[assignee].forEach(task=>{
html+=`<li>${task}</li>`;
});

html+="</ul></div>";

}

document.getElementById("output").innerHTML=html;

}

function copyOutput(){

let text=document.getElementById("output").innerText;

navigator.clipboard.writeText(text);

alert("Copied to clipboard");

}

function clearText(){

document.getElementById("inputText").value="";
document.getElementById("output").innerHTML="";

}

function selectAll(){

document.querySelectorAll(".status-grid input").forEach(cb=>{
cb.checked=true;
});

}

function clearAll(){

document.querySelectorAll(".status-grid input").forEach(cb=>{
cb.checked=false;
});

}

</script>

</body>
</html>
